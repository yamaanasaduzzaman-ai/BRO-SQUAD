<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#111c35"/>
      <stop offset="100%" stop-color="#060911"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4"/>

  <!-- Glowing Emblem Ring -->
  <circle cx="256" cy="240" r="150" fill="none" stroke="url(#emeraldGrad)" stroke-width="12" opacity="0.8" filter="url(#glow)"/>
  
  <!-- Glass Center Shield -->
  <rect x="146" y="130" width="220" height="220" rx="44" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.25)" stroke-width="3"/>

  <!-- Currency / Squad Logo Monogram -->
  <text x="256" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="110" font-weight="900" fill="url(#emeraldGrad)" text-anchor="middle" filter="url(#glow)">৳</text>

  <!-- Squad Title -->
  <text x="256" y="415" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" fill="#e2e8f0" letter-spacing="6" text-anchor="middle">BRO SQUAD</text>
  <text x="256" y="445" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#94a3b8" letter-spacing="3" text-anchor="middle">EXPENSE MANAGER</text>
</svg>
